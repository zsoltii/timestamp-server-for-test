name: Local mcp servers
version: 0.0.1
schema: v1
mcpServers:
  - name: fetch from internet
    command: docker
    args:
      - run
      - -i
      - --rm
      - "mcp/fetch"
  - name: duckduckgo
    command: docker
    args:
      - run
      - -i
      - --rm
      - "mcp/duckduckgo"
  - name: playwright
    command: docker
    args:
      - run
      - -i
      - --rm
      - "mcp/playwright"
  - name: mavendependencies
    command: npx
    args:
      - -y
      - mcp-maven-deps
