server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: timestamp-server

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Timestamp server configuration
timestamp:
  key-algorithm: RSA
  key-size: 2048
  signature-algorithm: auto
  certificate-subject: CN=Test Timestamp Authority, O=Digital Signature, C=HU
  policy-id: 1.3.6.1.4.1.13762.3
  validity-days: 365
  # PKCS12 Keystore configuration (optional - if not set, generates key pair on startup)
  # keystore-path: /path/to/keystore.p12
  # keystore-password: keystorePassword
  # key-alias: timestampKey
  # key-password: keyPassword


# OCSP responder: forwarding of requests whose certificates match no issuer profile.
# These are the startup defaults (web UI checkbox and URL); they can be changed at runtime in the
# web UI or with PUT /api/ocsp/forwarding, and a restart restores these values.
# Environment variables: OCSP_FORWARDING_ENABLED, OCSP_FORWARDING_URL
ocsp:
  forwarding:
    enabled: false
    # url: http://ocsp.example.com/ocsp

# Log levels. OCSP problems (malformedRequest, unauthorized, internalError, rejected admin calls)
# are logged at WARN with the reason, successful OCSP answers and admin changes at INFO. Set the
# OCSP loggers to DEBUG to also log every incoming request with its CertIDs.
logging:
  level:
    com.digital.signature.service.OcspService: INFO
    com.digital.signature.controller.OcspController: INFO
    com.digital.signature.controller.OcspCustomPathFilter: INFO
