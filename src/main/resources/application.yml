server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: timestamp-server

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Timestamp server configuration
timestamp:
  key-algorithm: RSA
  key-size: 2048
  signature-algorithm: SHA256WithRSA
  certificate-subject: CN=Test Timestamp Authority, O=Digital Signature, C=HU
  policy-id: 1.3.6.1.4.1.13762.3
  validity-days: 365
  # PKCS12 Keystore configuration (optional - if not set, generates key pair on startup)
  # keystore-path: /path/to/keystore.p12
  # keystore-password: keystorePassword
  # key-alias: timestampKey
  # key-password: keyPassword
