version: '3.8'

services:
  timestamp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: timestamp-server:latest
    container_name: timestamp-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=INFO
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

